# The cameras' loops as video files (extras/clips/<camera>.mp4), so the dashboard plays them
# itself and draws the vision overlay in step: an MJPEG stream has no playback position.
# Only the loops: the sources, analyses and anything else in extras/clips stay unserved.
server {
    listen 8080;
    listen [::]:8080;
    root /clips;

    location ~ "^/[a-z0-9-]+\.mp4$" {
        types { video/mp4 mp4; }
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        return 204;
    }

    location / {
        return 404;
    }
}
