services:

  # ====================================================================================
  # brighton-match-analysis: iot layer (creates p4n4-net; start it before ../ai and ../extras)
  #   club match device ──HTTPS (team contract 0.1)──► ingest ──┬──► ./data/ingest/ingest.db (SQLite: matches,
  #                                                             │      windows, plays, game plans, deviations, calls)
  #                                                             ├──► influxdb ──► grafana   (Match analysis)
  #                                                             └──► mqtt (<MQTT_TOPIC_ROOT>/<site>/…)
  #   analysis room, plan editor, reports ──► ingest :8090/analysis/
  #   p4n4-dashboard Feed tab ──► p4n4-api ──► ingest /api/v1/feed
  # ====================================================================================

  # ------------------------------------------------------------------------------------
  # Contract ingest: the web side of the club device ↔ web contract 0.1, the game plans
  # against what the device measured, the analyst's queue, and the agent API
  # ------------------------------------------------------------------------------------
  ingest:
    image: python:3.13-slim
    container_name: p4n4-ingest
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "8090:8080"   # contract API and the analysis room (remap in docker-compose.override.yml)
    command: ["python", "-u", "/p4n4/ingest.py"]
    # The host user, so ./data/ingest/ingest.db is yours to read and back up
    user: "${DATA_UID:-1000}:${DATA_GID:-1000}"
    read_only: true
    environment:
      TZ: ${TZ:-UTC}
      SITE_TZ: ${SITE_TZ:-UTC}
      # This club's device token, plus any others (site_id:token,site_id:token)
      INGEST_SITE_TOKENS: "${SITE_ID:-brighton}:${SITE_TOKEN:-},${EXTRA_SITE_TOKENS:-}"
      INGEST_READ_TOKEN: ${INGEST_READ_TOKEN:-}
      INGEST_DEFAULT_SITE: ${SITE_ID:-brighton}
      INGEST_RETENTION_DAYS: ${RETENTION_DAYS:-400}
      SEASON_START: ${SEASON_START:-2026-08-21}
      ANALYSIS_VIDEO_URL: ${ANALYSIS_VIDEO_URL:-}
      # "-", not ":-": ANALYSIS_PUBLIC_URL= (empty) means feed items carry no link
      ANALYSIS_PUBLIC_URL: ${ANALYSIS_PUBLIC_URL-http://localhost:8090/analysis/}
      INGEST_DB: /data/ingest.db
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-p4n4-stack-token}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-ming}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-raw_telemetry}
      MQTT_HOST: mqtt
      MQTT_TOPIC_ROOT: ${MQTT_TOPIC_ROOT:-brighton}
      # n8n in ../ai: deviations, half time and full time, for the staff (empty: off)
      NOTIFY_URL: ${NOTIFY_URL-http://n8n:5678/webhook/brighton}
      NOTIFY_TOKEN: ${NOTIFY_TOKEN:-}
      # The ai layer's agent, for the analysis room's recaps (its narrator); empty: none
      AGENT_URL: ${AGENT_URL-http://p4n4-ollama:11434}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      # ingest.py and its modules, and analysis/ (the analysis room, the plan editor, the reports)
      - ./ingest:/p4n4:ro
      - ./data/ingest:/data
    depends_on:
      mqtt:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - p4n4-net

  # ------------------------------------------------------------------------------------
  # MQTT Broker (Eclipse Mosquitto): the ingest service publishes <MQTT_TOPIC_ROOT>/<site>/…
  # ------------------------------------------------------------------------------------
  mqtt:
    image: eclipse-mosquitto:2.0.22
    container_name: p4n4-mqtt
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "1883:1883"   # MQTT TCP
      - "9001:9001"   # MQTT WebSocket
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - p4n4-net

  # ------------------------------------------------------------------------------------
  # Time-Series Database (InfluxDB 2)
  # ------------------------------------------------------------------------------------
  influxdb:
    image: influxdb:2.9
    container_name: p4n4-influxdb
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-adminpassword}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-ming}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-raw_telemetry}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RETENTION:-400d}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-p4n4-stack-token}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - p4n4-net

  # ------------------------------------------------------------------------------------
  # Data Visualization (Grafana)
  # ------------------------------------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:12.4.3
    container_name: p4n4-grafana
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-adminpassword}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/match-analysis.json
      # Dark UI unless the page asks for ?theme=light (p4n4-dashboard passes its
      # own theme), styled HTML header panel
      GF_USERS_DEFAULT_THEME: dark
      GF_USERS_DEFAULT_LANGUAGE: ${GRAFANA_LANGUAGE:-en-US}
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Read-only access without signing in, e.g. for p4n4-dashboard's Grafana tab
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Lets p4n4-dashboard's web build show Grafana in an <iframe>
      GF_SECURITY_ALLOW_EMBEDDING: ${GRAFANA_ALLOW_EMBEDDING:-false}
      # Path Grafana serves under: "/" (default), or e.g. "/grafana/" when
      # p4n4-dashboard proxies it on its own origin (GRAFANA_UPSTREAM)
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-%(protocol)s://%(domain)s:%(http_port)s${GRAFANA_SUB_PATH:-/}}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Passed to provisioning files via env var expansion
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-p4n4-stack-token}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-ming}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-raw_telemetry}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      # The Premier League's lion in place of Grafana's icons (tab favicon, menu and login logo, and the dashboard's
      # header: iot/scripts/theme_assets.py)
      - ../theme/grafana/fav32.png:/usr/share/grafana/public/img/fav32.png:ro
      - ../theme/grafana/apple-touch-icon.png:/usr/share/grafana/public/img/apple-touch-icon.png:ro
      - ../theme/grafana/grafana_icon.svg:/usr/share/grafana/public/img/grafana_icon.svg:ro
      # Grafana 12 draws its menu and login logo from a content-hashed copy.
      # This is grafana-oss:12.4.3's; tests/smoke.sh fails when an upgrade
      # changes it, so update the hash with the image.
      - ../theme/grafana/grafana_icon.svg:/usr/share/grafana/public/build/static/img/grafana_icon.1e0deb6b.svg:ro
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - p4n4-net

  # ------------------------------------------------------------------------------------
  # Demo club device (profile "demo"; enabled by COMPOSE_PROFILES in .env): the match
  # engine plays Brighton's season, the device's analytics measure it, and it posts
  # a live match and past ones (with their game plans and calls) to the ingest service
  # ------------------------------------------------------------------------------------
  simulator:
    image: python:3.13-slim
    container_name: p4n4-simulator
    restart: ${RESTART_POLICY:-unless-stopped}
    profiles: [demo]
    command: ["python", "-u", "/scripts/simulate.py"]
    user: "65534:65534"
    read_only: true
    environment:
      INGEST_URL: http://ingest:8080
      INGEST_TOKEN: ${SITE_TOKEN:-}
      # The staff's token, for the game plans and the calls on past matches
      INGEST_READ_TOKEN: ${INGEST_READ_TOKEN:-}
      SITE_ID: ${SITE_ID:-brighton}
      SITE_TZ: ${SITE_TZ:-UTC}
      SIMULATOR_SPEED: ${SIMULATOR_SPEED:-3}
      SIMULATOR_HISTORY: ${SIMULATOR_HISTORY:-8}
      LEAGUE_FILE: /league.json
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      # simulate.py, engine.py (the match engine), analytics.py (the device's measuring), diagram.py (keyframes)
      - ./scripts:/scripts:ro
      # The league's clubs, shared with the analysis room
      - ./ingest/analysis/league.json:/league.json:ro
    depends_on:
      ingest:
        condition: service_healthy
    networks:
      - p4n4-net

# ====================================================================================
# NETWORKS
# ====================================================================================
networks:
  p4n4-net:
    name: p4n4-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ====================================================================================
# VOLUMES
# ====================================================================================
volumes:
  mosquitto-data:
  mosquitto-log:
  influxdb-data:
  influxdb-config:
  grafana-data:
